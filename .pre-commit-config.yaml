# ─────────────────────────────────────────────────────────────
# BeatMorph — pre-commit hooks
# 安装：uv run pre-commit install
# 手动跑：uv run pre-commit run --all-files
# ─────────────────────────────────────────────────────────────
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # ⚠️ 该夹具**故意**伪装成 .json（内容是 PEC 文本），用于验证「格式必须按内容嗅探、
        # 不能信后缀」（plan 02 M1）。check-json 必须显式放行，否则门禁与夹具互相打架。
        exclude: ^tests/fixtures/phigros/pec_masquerade\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]           # 阻止大文件入库（模型/音频走 LFS/外部存储）
      - id: end-of-file-fixer
        exclude: \.osu$|\.sm$|\.ma2$     # 谱面文件保留原始尾行
      - id: trailing-whitespace
        exclude: \.osu$|\.sm$|\.ma2$
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key            # 防密钥泄露

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]             # 强制 Conventional Commits


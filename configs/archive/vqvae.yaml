# Hydra 模型组配置 — Stage2 前置 VQ-VAE 谱面 tokenizer（group=model → 自动前缀为 cfg.model）
# 奠基文档 §3.2 / plan 02。per-bar 1D-CNN + 2 层小节间 Transformer + straight-through 量化。
# 注意：组配置文件内容自动挂到组的 key 下，**勿再包 model:**（否则会双重嵌套 cfg.model.model）。

name: vqvae
codebook_size: 2048       # 契约 CODEBOOK_BASE（M2 重建不达标再升 4096 精细档）
latent: 256               # encoder / 码本维度
lane: 4                   # 契约 DEFAULT_LANE_COUNT（守 R-6，仅 4K）
time_bins: 64             # 每 bar 16 分音×4，半 bin 15.6ms @120bpm < ±20ms 容差
feat: 6                   # 5 NoteType one-hot + 1 duration 标量
cnn_channels: [64, 128]   # per-bar 1D-CNN 各层通道数
transformer_layers: 2     # 小节间上下文 Transformer 层数
transformer_heads: 4      # 注意力头数（须整除 latent）
dropout: 0.1

# 防坍缩三连（R-2）
commit_weight: 0.25       # 增大 commitment loss
codebook_weight: 1.0      # 标准 codebook loss
util_weight: 0.1          # γ 码本熵约束（推均匀使用）
dead_code_steps: 500      # 连续未激活阈值，超过判死码
restart_every_n_steps: 200  # 死码随机重启周期（步）

# 重建三项 loss 权值
type_weight: 1.0
present_weight: 1.0
present_pos_weight: 15.0   # present 头正类加权（≈ 空bin:有Note比，缓解稀疏类不平衡，RFC-0027）
dur_weight: 0.5

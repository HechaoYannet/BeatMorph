# 真实数据训练配置（plan 07 §3.2；plan 02 产出的清单 + 特征缓存）
#
# max_samples: null 表示**全量** ⇒ 属于「扩大数据规模」⇒ 必须先有全绿的 gates.txt，
# 否则 beatmorph-train 会以退出码 5 拒绝启动（fail-closed）。
run:
  experiment: phigros_masked
  purpose: train
  backend: torch        # 目标栈见 run.backend=lightning（需要 uv sync --extra train）
  runs_dir: runs
  save_every: 1000

data:
  source: manifest
  manifest_path: data/processed/pairs.json
  chart_dir: data/processed/charts
  feature_dir: data/processed/features
  split_train: train
  split_val: val
  provenance:
    # ⚠️ 合规硬约束③：来源与用途必须如实填写，缺一即启动失败。
    # 这里的值与 data/processed/charts.jsonl 的行级 provenance 必须一致（逐张可追溯）。
    source: "https://api.phira.cn/chart（Phira 官方 API，见 docs/knowledges/phira-dataset-survey.md）"
    query: "type=3（any）全量分页 pageNum=30（322 页，实测 9651 张）；逐张预筛 + 选择性下载；全库口径，记账见 data/processed/fetch_report.json"
    fetched_at: "2026-09-26T15:22:18.020816+00:00"
    purpose: train
    script: "scripts/fetch_phira.py"
    script_version: "1.0.0"
  t_window: 192
  x_bins: 128
  k_max: 128
  occlusion_ratio: 0.5
  # ★ τ 轴终点口径（RFC-0031，plan 03 §9-14）——"audio" = min(谱面口径, 特征缓存的音频时长)。
  #   实测（2026-09-27 第五轮，全库 8551 张）：**52.2%** 的谱面 META.chartTime 虚高
  #   （中位 52.8×、最大 3.4e6×），旧口径（"chart"）把 train split 撑到 **3361 万窗**
  #   （98% 是空窗 + 音频整段补零），全库索引 2.3 h，并在门禁上伪造出
  #   「G1 空过（0 事件）/ G2 打乱臂反而更优」两个假结论。
  #   修复后：train split **634 952 窗**、索引 36.5 min（有缓存），真实切片门禁 **G1-G4 全绿**。
  #   改回 "chart" 即回到旧行为（对照用）；tau_end_s 可显式覆盖一切。
  tau_end_policy: audio
  # 取批的行级 LRU（plan 02 §9 ④）：同一行的多个窗口不再重复解析 4 MB 谱面 / 重复读 40-50 MB 特征。
  chart_cache_size: 8
  feature_cache_size: 2
  max_samples: null

model:
  d_model: 256
  n_heads: 4
  n_layers: 6
  window: 32
  global_period: 4
  k_max: 128
  dropout: 0.1
  head: factorized
  audio_dim: 1024

optim:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 1        # 跨谱 batching 需要同一网格身份，见 beatmorph/data/dataset.py 的说明
  max_steps: 20000
  val_every: 500
  precision: bf16-mixed
  seed: 0

gates:
  required: true
  smoke_max_samples: 8
  overfit_steps: 300
  overfit_target_ratio: 0.1
  # ★ 门禁预算必须让模型**真的收敛**，否则 G2（打乱对照）与 G3（优于常数基线）两臂都
  #   停在初始点附近 ⇒ 判据退化成恒 FAIL。实测 2026-09-27 第四轮（真实 200 行切片、
  #   chunks=16、lr=3e-4）：100 步 → G2 差距 0.7%（需 5%）、G3 比常数基线差 **68 倍**；
  #   仿照合成夹具把门禁 lr 抬到 0.05 → λ 直接 NaN（真实场 scale 不同，不能照搬）；
  #   真正的修法是**去掉一个属于 G1 的人为初值**（对照臂走 contrast_initial_head_bias=0，
  #   见 schema 字段说明）——那之后 G3 在原始 100 步预算内就收敛；因此这里**不**靠加步数追绿。
  #   （判据一个字未改：G1 相对判据 / G2 ≥1.05x / G3 ≤0.9x / G4 帧率。）
  shuffle_steps: 100
  # G2 的样本数（判据的一部分：样本太少时打乱臂直接背样本，plan 07 §9-12）。
  shuffle_samples: 16
  # 前向的**分段数**（plan 07 §9-15/§9-19）：内存随「同时在场的样本数」线性增长。
  # 实测（真实窗口、本机）：chunks=4 时 GPU 显存 7.8/8.1 GB，落到**分配器抖动**——
  # GPU 100% 利用率却只有 28 W，16 样本 × 100 步的 G3 预计算 107 min 未完成；
  # chunks=16（=1 样本/段）后峰值 5.3 GB、94 W，同一预算数分钟完成。
  # 分段**不改判据**（按样本求和的损失下逐段反传与不分段一致，loss 相对差 2.3e-8）。
  shuffle_chunks: 16
  # 门禁批必须含至少这么多事件（默认 1 = 非空；plan 07 §9-26）：取不到就重抽，重抽上限内仍取不到即抛。
  # 来历：真实切片上 G1 曾抽到 **0 事件**窗口，报出 "loss 7819.5 -> 0.0014" 的**空过** PASS。
  batch_min_events: 1
  # G1 专用：抬高累积强度头初值，使首步远离最优（G1 是相对判据：末步 <= 0.1 x 首步）。
  # 对照臂（G2/G3）用 `contrast_initial_head_bias`（默认 0 = 自然初始化）——
  # 把 G1 的人为初值强加给它们会让预算全花在压积分项上（实测见 schema 的字段说明）。
  initial_head_bias: 20.0
  # ⚠️ 时间预算（2026-09-27 第五轮实测，GPU=cuda、200 行切片）：整轮门禁 **2305.8 s ≈ 38 min**，
  #    其中数据集索引**命中落盘缓存**（秒级）；G2 两臂 100 步占约 23 min。
  #    步时 ∝ (K·T)²（global 层对 K·T 做全自注意力）：G1 批 K=12 → 0.10 s/步、
  #    G2 批 K=29（L=5568）→ ~7 s/步、G3 批 K=33 → ~9 s/步。
  #    必须给 `--device cuda`（CPU 上是小时级）；且 8 GB 卡上**不能**让四个批 + 四个模型同时在场
  #    （实测 7.88/8.15 GB → 滑进 Windows 共享内存 → 同一个 G3 步 0.57 s 变 8.8 s，整轮跑不完），
  #    因此 G3 的预计算被排成先跑、跑完立即释放（plan 07 §9-27）。

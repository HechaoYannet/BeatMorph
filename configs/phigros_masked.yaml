# 真实数据训练配置（plan 07 §3.2；plan 02 产出的清单 + 特征缓存）
#
# max_samples: null 表示**全量** ⇒ 属于「扩大数据规模」⇒ 必须先有全绿的 gates.txt，
# 否则 beatmorph-train 会以退出码 5 拒绝启动（fail-closed）。
run:
  experiment: phigros_masked
  purpose: train
  backend: torch        # 目标栈见 run.backend=lightning（需要 uv sync --extra train）
  runs_dir: runs
  # ── 长跑运维（plan 07 §4.5/§4.6；事故/教训见 docs/TRAINING.md §7.5）──────────
  # save_every = 每 2 轮（1 轮 = 一个 val 周期 = optim.val_every=1000 步）⇒ 2000 步一次存盘。
  # 代价上界：崩溃最多丢一个存盘间隔的工作量。⚠️ 若实测步时明显偏离（纯 GPU 分钟级 vs
  # 分钟以上），按「丢 ≤ 30-40 分钟」重新对齐这个数，别照抄。
  # ⚠️ best.pt **不再**由存盘步决定：它由 val 触发（见 optim 段的说明），存盘步只管
  # 步级 checkpoint 与旋转。
  save_every: 2000
  # 过程标量的刷新间隔：每 50 步刷进 TB 与 logs/loss_history.jsonl。
  # **长跑必须能在线看到曲线**——此前只在训练结束时写一次，人力监控整轮什么也看不到。
  log_every: 50
  # checkpoint 旋转：只保留最新 3 个步级存盘（外加最优快照 best.pt），先写后删。
  keep_last: 3
  keep_best: 1
  # ★ RFC-0039 R3（2026-09-29 采纳）：每 20 000 步**端到端生成一张谱面**供人工审阅。
  #   NLL/val_ratio 回答不了「会不会写谱」；这条通道给出可看的产物：
  #     tests/e2e-val/outputs/<YYYYMMDD-HHMMSS>-step<N>/{chart.json, meta.json, notes.txt}
  #   输入在 tests/e2e-val/（本地资产，audio/feature/outputs 均不入库；只有 meta.json 入库）。
  #   条件（判定线事件轨 + BPM+定数）按**音频 sha1** 从训练清单里找回该曲的谱面；
  #   找不到就退化为无条件生成（合成模板），并如实写进产物 meta.json 的 template.source。
  #   ⚠️ **不是门禁**：不产生 PASS/FAIL、不阻塞训练、不参与选权重；失败只告警（e2e_failed=1）。
  #   解码走 decoder/ 的合法性与可玩性后处理，违规项非空则拒绝导出 chart.json（红线 6）。
  e2e_every: 20000
  e2e_dir: tests/e2e-val

data:
  source: manifest
  manifest_path: data/processed/pairs.json
  chart_dir: data/processed/charts
  feature_dir: data/processed/features
  # ★ 窗口预切缓存（第十二轮 §9-52 落地的开关；第十三轮全量建成 + 终验通过，plan 07 §9-54⑮）：
  #   train 634 952 窗（train/aa677031c17e3a3d，353.6 GB）+ val 74 889 窗（val/fac0448693925c86，41.7 GB），
  #   逐位一致 400/400 + 100/100、读取 95.2 / 76.2 窗/s（原路径 81× / 65×）。
  #   指纹不符时自动回落原路径（_open_window_cache 返回 None，无静默降级）；null = 不用缓存。
  #   进 RESUME_IGNORED_KEYS：改它不影响续训指纹。相对路径按进程 CWD 解析（从仓库根启动）。
  window_cache_dir: data/processed/window_cache
  split_train: train
  split_val: val
  provenance:
    # ⚠️ 合规硬约束③：来源与用途必须如实填写，缺一即启动失败。
    # 这里的值与 data/processed/charts.jsonl 的行级 provenance 必须一致（逐张可追溯）。
    source: "https://api.phira.cn/chart（Phira 官方 API，见 docs/knowledges/phira-dataset-survey.md）"
    query: "type=3（any）全量分页 pageNum=30（322 页，实测 9651 张）；逐张预筛 + 选择性下载；全库口径，记账见 data/processed/fetch_report.json"
    fetched_at: "2026-09-26T15:22:18.020816+00:00"
    purpose: train
    script: "scripts/fetch_phira.py"
    script_version: "1.0.0"
  t_window: 192
  x_bins: 128
  k_max: 128
  occlusion_ratio: 0.5
  # 遮盖粒度：event（默认，契约路径）| block（(τ,x) 小块，保留 token 内可见邻居）。
  # ⚠️ 非 event 时窗口缓存不兼容 ⇒ 必须同时把 window_cache_dir 设为 null。
  occlusion_granularity: event
  # 目标口径（plan 07 §9-79）：只入账**可计分** note（非 fake 且命中时线可见）。
  # 实测摘掉 train 22.81% / val 18.68% 的事件（其中一半落在真线上 ⇒ 线级剥离拿不掉）；
  # 真实语料里「可计分 note 落在装饰线上」= 0。打开它必须同时把 window_cache_dir 设为 null。
  scorable_target: false
  # ★ τ 轴终点口径（RFC-0031，plan 03 §9-14）——"audio" = min(谱面口径, 特征缓存的音频时长)。
  #   实测（2026-09-27 第五轮，全库 8551 张）：**52.2%** 的谱面 META.chartTime 虚高
  #   （中位 52.8×、最大 3.4e6×），旧口径（"chart"）把 train split 撑到 **3361 万窗**
  #   （98% 是空窗 + 音频整段补零），全库索引 2.3 h，并在门禁上伪造出
  #   「G1 空过（0 事件）/ G2 打乱臂反而更优」两个假结论。
  #   修复后：train split **634 952 窗**、索引 36.5 min（有缓存），真实切片门禁 **G1-G4 全绿**。
  #   改回 "chart" 即回到旧行为（对照用）；tau_end_s 可显式覆盖一切。
  tau_end_policy: audio
  # 取批的行级 LRU（plan 02 §9 ④）：同一行的多个窗口不再重复解析 4 MB 谱面 / 重复读 40-50 MB 特征。
  chart_cache_size: 8
  feature_cache_size: 2
  # 取样本的 DataLoader worker 进程数（0 = 主进程同步取批）。
  #   **语义无关**（RFC-0034 §5）：顺序与覆盖率都是「计划层」的纯函数（beatmorph/data/plan.py）
  #   ⇒ 改它不改变样本序列、不改变覆盖率、不改变续训指纹（进 checkpoint.RESUME_IGNORED_KEYS）。
  #   ⚠️ 必须同时限住每个 worker 的 BLAS 线程，否则 N 个 worker 各自开满 24 核会过度订阅：
  #      启动前设 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1（未设时训练会打 WARNING）。
  #   ★ 8 来自 2026-09-27 第十轮的标定（scripts/local_worker_scaling.py，真实 train split）：
  #     供给 2.51 / 4.42 / **6.33** / 5.75 / 6.28 窗口/s @ N=3/6/8/10/12。
  #     ⚠️ 那份标定是在 DataLoader **默认 in_order=True** 下测的 ⇒「N≥8 封顶」是队头阻塞的
  #     产物，**不是 worker 数的上限**；N 到底该取多少，必须在 §9-50 修完管线之后重标。
  #
  #   ★ **2026-09-27 §9-50：管线已修（队头阻塞）**。取批改为 `in_order=False` + 主进程按
  #     槽位重排（`beatmorph/infra/train_loop.py` 的 SlotTag / _SlotTaggedDataset /
  #     _collate_with_slot），**样本序列与覆盖率逐位不变**。
  #     实测（scripts/local_inorder_ab.py，ABBA 交错、真实 train split、60 s×2 臂）：
  #       旧管线 6.39 窗口/s（交付 p90 561-575 ms）→ 新管线 **8.67 窗口/s（1.36×）**
  #       （交付 p90 15-139 ms）；不重排的裸 in_order=False = 8.71 ⇒ 重排的代价 **0.5%**。
  #       windows_seen 轨迹前 389 步**逐位一致** —— 吞吐变了，模型看到的东西一个字节没变。
  #     训练需求约 11.5 窗口/s（计算段中位 0.087 s）⇒ **8 个 worker 仍然差约 25%**。
  #     但**不要再靠加 worker 追**：内存账见下，而且端到端剩余空间本来就只有约 1.29×
  #     （compute mean 0.151 s vs step mean 0.195 s）。真正的下一层是物化侧的整谱重复
  #     （每窗口 91.3% 的 CPU 花在「一张谱只该做一次」的事上），见 RFC-0035。
  #     每 worker 约 1 GiB；commit 曾到 38.1/40.1 GiB（95%）⇒ N=8 同时是内存上限。
  workers: 8
  # 取批顺序：False = 旧行为（第 k 轮发各谱第 k 窗 ⇒ 前 6614 步只有前奏窗，实测 61.5% 空窗）；
  # True = 每轮每谱发它自己的随机一块（轮转/覆盖率不变，前缀成为全库无偏切片）。见 plan 07 §9-70。
  plan_window_shuffle: false
  max_samples: null

model:
  # 输出场按遮盖通道置零（未被遮盖处的最优 λ 恒为 0，见 ModelConfig.mask_lambda / plan 07 §9-74）。
  mask_lambda: false
  d_model: 256
  n_heads: 4
  n_layers: 6
  window: 32
  global_period: 4
  k_max: 128
  dropout: 0.1
  head: factorized
  audio_dim: 1024
  # ★★ RFC-0039 R1（2026-09-29 决策者裁定通过）：以下两个开关**转正为基线配置**。
  #   head_skip=false：移除输出头对**原始输入特征**的直连 skip。对被遮盖 token，它原来的输入恒为
  #     常数 [0…0, 1…1] ⇒ 只能给一个与 token 无关的空间先验（实测与真实事件格**反相关**：命中率
  #     0.367 < 0.5），并且这条「容易的路」让 trunk 学不动（权位移 5–20% vs head 1100–2900%）。
  #   audio_align=true：把**与该 τ 切片同一时刻**的音频帧（含帧差分）投影后直连注入 token。
  #   ⚠️ 两者**串联**才生效：只开 head_skip=false 只拿到一小部分收益（512 窗 val_ratio 0.9465），
  #     只开 audio_align=true 完全无效（0.9608）。二者同时打开：训练损失 ~10 → 0.015、
  #     512 窗 val_ratio 0.9608 → 0.7454（配对 t = +3.03）。全链实测见 plan 07 §9-62。
  #   ⚠️ schema 的代码默认值**故意不变**（head_skip=true / audio_align=false），以免 smoke 等
  #     其它配置与门禁被静默改变——转正的依据是**本配置**，不是默认值。
  head_skip: false
  audio_align: true
  # ★ 头的无条件 τ 偏置（plan 07 §9-77，默认关）。开启后 = 在头的 logits 上加 (192,) 的
  #   可学习偏置，让「无条件场先验」不再依赖被 local 层平均掉的 τ 位置信息。
  #   实测依据：未训练模型的 decode 输出沿 τ 起伏 2.06，训练后 0.00000（三层 local 压平）；
  #   而语料 τ 表在真实 val 上的组内 AUC 是 0.9292（模型 0.5009）。
  head_tau_bias: false
  # 空间分支上的同一件事：直接表达无条件的联合先验 p(τ, x, s, c)。
  head_cell_tau_bias: false

optim:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 1        # 跨谱 batching 需要同一网格身份，见 beatmorph/data/dataset.py 的说明
  # 诊断开关：只训 model.head（冻结解码器与输入嵌入）。用于把「头能不能解出任务」与
  # 「联合优化能不能解出」分开（plan 04 §9-17 的手法，plan 07 §9-72 定位到解码器后必须做）。
  train_head_only: false
  max_steps: 20000
  # ★ val（plan 07 §9-47，2026-09-27 第十轮）：此前 val_every 只是**空转**的字段，
  #   TB 里没有任何 val 曲线，而 best.pt 按**训练损失**选 —— 实测那等于「按谁抽到最空的
  #   窗选模型」（43.8% 的步是空窗，中位 loss 6.5e-4 vs 非空 96，差五个数量级；那个
  #   被选中的 checkpoint 是 step 6234 的 events=0 / K=1 空窗）。
  #   现在：split_val（814 张，按曲目切分）→ plan_epoch(epoch=0) 的前 val_windows 个槽位，
  #   每 val_every 步**原样重放**（同窗口 + 同遮盖种子 ⇒ 逐位一致、跨步可比），
  #   主判据 = val/ratio = val/nll / val/nll_masked_constant（同一遮盖测度下的常数场最优值）。
  #   **best.pt 改按 val/ratio 选**。val 走 no_grad + model.eval()，不产生梯度、不参与 LR 与
  #   早停（§9-47 G-④），因此它与 val_windows 都**不进续训指纹**。
  #
  #   成本算式（§9-47 E 的式子**已被实测推翻**，以本节为准）：
  #     E 的 0.038 s/窗 + 1 次前向 + 训练流的 K ⇒ 算出 5.8%。三项全偏，实测如下：
  #       ① **数据侧实测 0.230 s/窗**（workers=8，无争用；workers=0 时 0.73 s）
  #          —— val 窗口全是「新行的第一个窗口」⇒ 整谱解析每窗重来一遍；
  #       ② **对照臂是 5 次前向**（E 只算 1 次）；
  #       ③ **val 前缀的 K 更重**：中位 30.5 / 均值 46.4 / p90 106 / max 111，
  #          **ΣK² = 422 139**（训练流 p90 53-67）。前向 ∝K² ⇒ 必须用 ΣK²，不能用中位。
  #   ★ **2026-09-27 §9-53 已修**（两处结构性改动，都不改指标语义）：
  #       ① **按网格桶成组取窗口**：128 个窗口从「128 个桶 → B=1 × 128 次前向」变成
  #          **17 批（均 7.5 窗/批）⇒ Σ(max K)² 从 422 139 降到 71 165 = 5.93×**
  #          （前向律取 bf16 时代实测拟合 `步时 ≈ 2.7e-4·K²`、前向 ≈ 步时/3）。
  #       ② **窗口预切缓存**（`data.window_cache_dir`）：数据侧 0.230 → **0.0096 s/窗**
  #          （实测 9.6 ms/窗），⇒ val 数据侧 28 s → **约 1.2 s**。
  #     ⇒ 一次 val ≈ 前向 5 臂 **32 s** + 数据 **1.2 s** ≈ **33 s = 199 s 预算的 16.7%**。
  #     要压到 5% 量级：再配 `val_every=4000` ⇒ **4.1%**（运行时长 1.04×）。
  #   ⚠️ 上面 5.93× / 33 s 是「实测 ΣK² + 实测数据侧 + 文献 K² 律」推出来的；
  #     一次 val 的**真实墙钟仍未经 GPU 实跑验证**（plan 07 §9-51/§9-53 存疑清单）。
  #   ⚠️ 组批改变了**归约顺序**（B=1 → B≤8）⇒ val 的**数值不再与组批前逐位相同**
  #     （指标语义不变：`reduction="mean"` 按有效线加权、填充线 line_mask=False 被排除）。
  #     跨步可比性与「同一配置两次调用逐位一致」都不受影响。
  #   ★ RFC-0039 R2（2026-09-29 采纳）：val 集合改为**跨桶 + 按事件密度分层**的确定性抽样，
  #     窗口数 128 → **512**；构成落盘到 logs/val_composition.json。换集合 = 换总体 ⇒
  #     历史 val/ratio 不再可比（只作历史记录）。
  #   ⚠️ 单次 val 的墙钟随窗口数线性上升（512 窗 ≈ 4x），因此**节奏必须一起改**：
  #     由 1000 改到 10000（20 000 步的 run 得到 2 个 val 点、1 个 e2e 产物点）。
  #     实测墙钟以 plan 07 §9-63 的复评为准；若明显超预算，先调 val_batch/节奏，
  #     不要退回去「少看窗口」——那正是 R2 要修的系统性偏差。
  val_every: 10000
  # 验证集窗口数（RFC-0039 R2：128 → 512）。抽的是**跨桶 + 按事件密度分层**的确定性样本，
  # 不再取「每桶前 N 个」——后者只覆盖计划里最早出现的十几个桶（实测 57.8% 空窗、事件/窗
  # 中位 0），比总体系统性容易，主判据的自噪声 sd ≈ 0.067 而本轮所有效应都在 0.04-0.15 量级。
  # ⚠️ 分层需要窗口预切缓存（事件数从缓存的稀疏计数廉价读出）；没有缓存时回退旧口径并
  #    在构成文件里记 stratified=false。
  val_windows: 512
  # 每个 val 批最多几个窗口（**同一网格桶**内才可同批）。8 是实测拐点：
  # 128 窗在 val_batch=8 下成 17 批、Σ(max K)² = 71 165 ⇒ 前向 5.93× 于逐窗。
  # 调大收益递减（批内 pad 到 max K），调大还会抬峰值显存；1 = 退回逐窗前向（对照用）。
  # ⚠️ 2026-09-28 显存事故（plan 07 §9-57）：8 GB 卡上驱动侧会滑进 Windows 共享内存，
  #    从 8 降到 4 留余量（val 指标语义不变，只是组批数增多、val 略慢）。
  val_batch: 4
  # 显存卫生阈值（GiB，plan 07 §9-57）：分配器「保留 − 已分配」超过它就把空闲块还给驱动。
  # 0 = 关闭。8 GB 卡上必须开着——K≈128 的大批会把保留量顶到 ~5.2 GiB 且长期不释放，
  # 驱动侧因此停在 7.86/8.15 GiB，下一次大分配就滑进 Windows 共享显存（功耗 102→31 W）。
  vram_hygiene_gib: 1.0
  precision: bf16-mixed
  seed: 0

gates:
  required: true
  smoke_max_samples: 8
  # 门禁批的数据规模上限（行数）——**与训练规模解耦**（RFC-0033 后果）。
  # 单步成本 ∝ (K·T)²，而修好采样器后门禁批会从全库按剩余窗口加权抽桶（K 可到 128）：
  # 实测门禁 5 min → 26 min、显存 7880/8151 MiB（滑进共享内存的危险区）。
  # 200 行与第五轮权威门禁记录（data.max_samples=200）同口径。None = 不限界（仅诊断用）。
  gate_samples: 200
  overfit_steps: 300
  overfit_target_ratio: 0.1
  # ★ 门禁预算必须让模型**真的收敛**，否则 G3（优于常数基线）停在初始点附近 ⇒
  #   判据退化成恒 FAIL。实测 2026-09-27 第四轮（真实 200 行切片、chunks=16、lr=3e-4）：
  #   100 步 → G3 比常数基线差 **68 倍**；仿照合成夹具把门禁 lr 抬到 0.05 → λ 直接 NaN
  #   （真实场 scale 不同，不能照搬）；真正的修法是**去掉一个属于 G1 的人为初值**
  #   （对照臂走 contrast_initial_head_bias=0，见 schema 字段说明）——那之后 G3 在原始
  #   100 步预算内就收敛；因此这里**不**靠加步数追绿。
  #   （RFC-0037：G2 已删除，原 shuffle_* 三字段更名 baseline_* 归 G3 独用。）
  baseline_steps: 100
  # G3 批的样本数：太少时模型可在预算内背下小批，基线对照失效（plan 04 §9-17）。
  baseline_samples: 16
  # 前向的**分段数**（plan 07 §9-15/§9-19）：内存随「同时在场的样本数」线性增长。
  # 实测（真实窗口、本机）：chunks=4 时 GPU 显存 7.8/8.1 GB，落到**分配器抖动**——
  # GPU 100% 利用率却只有 28 W，16 样本 × 100 步的 G3 预计算 107 min 未完成；
  # chunks=16（=1 样本/段）后峰值 5.3 GB、94 W，同一预算数分钟完成。
  # 分段**不改判据**（per_event 的分段修正见 make_step_fn；loss 相对差 2.3e-8 量级）。
  baseline_chunks: 16
  # 门禁批必须含至少这么多事件（默认 1 = 非空；plan 07 §9-26）：取不到就重抽，重抽上限内仍取不到即抛。
  # 来历：真实切片上 G1 曾抽到 **0 事件**窗口，报出 "loss 7819.5 -> 0.0014" 的**空过** PASS。
  batch_min_events: 1
  # G1 专用：抬高累积强度头初值，使首步远离最优（G1 是相对判据：末步 <= 0.1 x 首步）。
  # G3（基线臂）用 `contrast_initial_head_bias`（默认 0 = 自然初始化）——
  # 把 G1 的人为初值强加给它会让预算全花在压积分项上（实测见 schema 的字段说明）。
  initial_head_bias: 20.0
  # ⚠️ 时间预算：旧实测（2026-09-27 第五轮，GPU=cuda、200 行切片）整轮门禁 2305.8 s ≈ 38 min，
  #    其中 G2 两臂占约 23 min——RFC-0037 删 G2 后预期 **≈10-15 min**（门禁臂改 fp32，
  #    单步略慢于 bf16，仍是分钟级）。步时 ∝ (K·T)²（global 层对 K·T 做全自注意力）：
  #    G1 批 K=12 → 0.10 s/步、G3 批 K=33 → ~9 s/步（bf16 实测；fp32 同量级）。
  #    必须给 `--device cuda`（CPU 上是小时级）；且 8 GB 卡上**不能**让多批 + 多模型同时在场
  #    （实测 7.88/8.15 GB → 滑进 Windows 共享内存 → 同一个 G3 步 0.57 s 变 8.8 s，整轮跑不完），
  #    因此 G3 的预计算被排成先跑、跑完立即释放（plan 07 §9-27）。

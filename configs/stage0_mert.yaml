# Hydra 训练配置 — Stage 0 MERT Adapter（LoRA）训练 / 离线提取
# 奠基文档 §3.1 / plan 01 / RFC-0003。
# Phase 1：MERT 主要用于离线 embedding 提取（adapter=none）；Adapter 训练为可选。

defaults:
  - model: mert
  - data: osu_50k
  - _self_

experiment:
  name: stage0_mert
  seed: 42
  max_steps: 50000
  grad_accum: 1
  precision: bf16-mixed
  gradient_clip: 1.0

trainer:
  strategy: auto
  devices: 1
  accelerator: gpu

infra:
  wandb:
    project: beatmorph
    entity: null
    log_every_n_steps: 50
  checkpoint:
    dir: ${oc.env:BEATMORPH_RUNS_DIR,runs}/checkpoints
    save_every_n_steps: 2000

log_level: INFO

data:
  raw_dir: ${oc.env:BEATMORPH_RAW_DIR,data/raw}
  embeddings_dir: ${oc.env:BEATMORPH_DATA_DIR,data/embeddings}/mert_v1_330m

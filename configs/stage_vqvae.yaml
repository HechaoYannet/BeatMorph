# Hydra 训练配置 — Stage2 前置 VQ-VAE tokenizer 训练
# 奠基文档 §7 Phase 1 / plan 02。纯谱面重建，不依赖 audio_emb。

defaults:
  - model: vqvae
  - data: osu_50k
  - _self_

experiment:
  name: stage_vqvae        # CLI 按 experiment.name 分发到 _run_vqvae
  seed: 42
  max_steps: 100000
  grad_accum: 1
  precision: bf16-mixed    # PyTorch Lightning
  gradient_clip: 1.0
  log_every_n_steps: 50    # TensorBoard 记录频率（step）

trainer:
  strategy: auto           # 单卡；多卡改 fsdp
  devices: 1
  accelerator: gpu

infra:
  tensorboard:
    dir: ${oc.env:BEATMORPH_RUNS_DIR,runs}/tensorboard
    name: stage_vqvae
    # enabled: true           # false 关闭 TensorBoard 记录
    # version: null           # null → 每次 run 自动新版本目录
  wandb:
    project: beatmorph
    entity: null
    log_every_n_steps: 50
  checkpoint:
    dir: ${oc.env:BEATMORPH_RUNS_DIR,runs}/checkpoints
    save_every_n_steps: 2000

train:
  batch_size: 8            # 变长小节数由 collate_vqvae padding
  lr: 3e-4
  num_workers: 0
  weight_decay: 0.01

log_level: INFO

# data 段由 data/osu_50k.yaml 注入；VQ-VAE 纯谱面重建，不需 embeddings_dir
data:
  charts_path: ${oc.env:BEATMORPH_DATA_DIR,data/processed}/charts.jsonl

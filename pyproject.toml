[project]
name = "beatmorph"
version = "0.1.0"
description = "BeatMorph — 音游谱面端到端自动生成系统（音频→MERT→VQ-VAE→RAG→DPO→.osu）"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "BeatMorph Team" },
]
license = { text = "Apache-2.0" }
keywords = ["rhythm-game", "chart-generation", "MERT", "VQ-VAE", "music-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

# 运行时依赖随各模块实现再补充，此处先固定核心基础栈
dependencies = [
    "numpy>=1.26,<3.0",
    "torch>=2.5.0",                # 奠基文档指定 2.5+，配合 torch.compile
    "torchaudio>=2.5.0",
    "pydantic>=2.5",               # 配置/数据契约校验
    "hydra-core>=1.3",             # 配置管理（奠基文档指定）
    "omegaconf>=2.3",
    "einops>=0.7",                 # 张量形状语义化
    "tqdm>=4.66",
    "rich>=13.7",                  # 终端美化/日志
    "torchcodec>=0.15.0",
]

[project.optional-dependencies]
audio = [
    # Stage 0 音频编码
    "transformers>=4.40",          # MERT 预训练权重
    "peft>=0.11",                  # LoRA Adapter 注入（RFC-0003 采纳）
    "modelscope>=1.18",            # MERT 权重国内拉取（ModelScope 镜像，HF fallback）
    "demucs>=0.11",                # 可选声源分离 (HTDemucs) - 规避 pip 改名问题
    "soundfile>=0.12",
    "librosa>=0.10",
    "llvmlite>=0.39",              # 强制选有 cp312 win_amd64 wheel 的版本
    "torchlibrosa>=0.1",
]
train = [
    "pytorch-lightning>=2.2",      # 奠基文档指定（FSDP 分布式）
    "wandb>=0.16",                 # 实验管理
    "datasets>=2.18",              # HuggingFace Datasets 存储
    "pyarrow>=15.0",               # Parquet
    "tensorboard>=2.16",
    "tokenizers>=0.20",           # BPE/event tokenizer (RFC-0028)
]
rag = [
    # RAG 检索
    "faiss-cpu>=1.8",              # 检索索引（百万级）
    # faiss-gpu 按需另外安装
]
data = [
    # 数据下载（Phira 谱面集抓取，plan 02 §3.2；RFC-0024 的 sayobot 路径已退役）
    "httpx>=0.27",                # 下载脚本 HTTP 客户端（Range / 流式）
    "PyYAML>=6.0",                # info.yml 解析（谱面文件定位的唯一依据）
    "pyarrow>=15.0",              # 清单/manifest 落盘（plan 02 M8 provenance）
]
viz = [
    # 强度场可视化（plan 03 §4.9 / M8：无权重、无 GPU 即可产出确定性 PNG）
    "matplotlib>=3.9",
]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "httpx>=0.27",                # 离线下载脚本单测（mock httpx，需 import）
    "respx>=0.21",                # httpx mock（tests/unit/scripts）
]

[project.urls]
Homepage = "https://github.com/BeatMorph/BeatMorph"
Documentation = "https://github.com/BeatMorph/BeatMorph/tree/main/docs"
Repository = "https://github.com/BeatMorph/BeatMorph"

# ── 命令行入口（Plan 09，随模块实现启用）──
[project.scripts]
beatmorph-train = "beatmorph.cli.train:main"
# beatmorph-generate = "beatmorph.cli.generate:main"  # Plan 07/09 末（Phase 2）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beatmorph"]

# ─────────────────────────────────────────────────────────────
# uv 配置（奠基文档指定 uv 包管理）
# ─────────────────────────────────────────────────────────────
[tool.uv]
# 统一锁文件，保证跨设备可复现
managed = true
# 默认开发组依赖（贡献者一键拉齐环境）
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

# 分组依赖（uv sync 自动安装）
[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",                # 下载脚本单测（mock，需 import）
    "respx>=0.21",                # httpx mock（tests/unit/scripts）
    "PyYAML>=6.0",                # plan 02：info.yml 定位单测
    "pyarrow>=15.0",              # plan 02 M8：manifest 落盘与 provenance 校验
    "matplotlib>=3.9",            # plan 03 M8：可视化契约测试（不得靠 skip 变绿）
]

# ─────────────────────────────────────────────────────────────
# Ruff：lint + format
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
# ⚠️ 模式必须**锚定仓库根**：裸写 "data" 会匹配任意层级的 data/，
# 从而静默跳过 beatmorph/data/**（plan 02 的整包）——这是「不报错但全错」型
# 门禁失效，已由 data-agent 用植入探针实测确认。改模式前请先跑该探针。
extend-exclude = [
    "/data",
    "/models",
    "/runs",
    "/outputs",
    "/docs",
    # ⚠️ ruff format 会格式化 Markdown 里的 python 代码块，而目录级排除对它不生效
    # （实测："make format" 会顺手改动 docs/ 下 6 份文档）。文档产出按 AGENTS.md §3.6
    # 属各自作者所有，工具不得越界改写，因此显式排除全部 Markdown。
    "**/*.md",
]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "C4",        # comprehensions
    "SIM",       # simplify
    "N",         # pep8-naming
    "ANN",       # flake8-annotations（鼓励类型标注）
    "PT",        # pytest 风格
    "PTH",       # 使用 pathlib
    "PL",        # pylint 子集
    "RUF",       # ruff 专属
]
ignore = [
    "E501",      # 行长由 formatter 处理
    "RUF001",    # CJK 全角字符在字符串中易被判歧义，本仓中文文档惯例，豁免
    "RUF002",    # 同 RUF001，针对 docstring
    "RUF003",    # 同 RUF001，针对注释
    "ANN101",    # 不强制 self 标注（pre-commit ruff 0.5.x 仍生效；新版 ruff 已废弃该项，保留以兼容）
    "ANN102",    # 不强制 cls 标注（同 ANN101）
    "PLR0913",   # 允许较多函数参数（ML 代码常见）
    "PLR0917",   # 同 PLR0913，允许较多位置参数（ML 构造器/forward 常见）
    "PLR2004",   # 允许张量秩/维度魔法值（如 !=3 / ==2 / 768/25/16），ML 代码惯例，常量化反成噪声
    "N812",      # 允许 `import torch.nn.functional as F`（PyTorch 社区约定俗成的非小写别名）
    "PLW0603",   # 日志单例初始化用 global（core/logging.py 有意为之）
    "PLC0415",   # 允许函数内局部 import（惰性加载重依赖，如 logging 的 json）
    "B008",      # 允许默认值实例化（如 Typer/FastAPI 风格）
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/**" = ["ANN", "PLR2004", "S101", "N806", "PT001", "PT004", "PT019", "PT023"]
"scripts/**" = ["ANN", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["beatmorph"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=beatmorph",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: 标记慢测试（CI 可单独跳过）",
    "gpu: 需要 GPU 才能运行的测试",
    "integration: 集成测试（多模块串联）",
    "e2e: 端到端测试（音频→谱面）",
]

# ─────────────────────────────────────────────────────────────
# mypy
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true        # torch/transformers 等无 stub
# ⚠️ 必须用 ^ 锚定：不锚定的 "(data|models|runs|outputs)/" 会命中 beatmorph/data/，
# 使 mypy 静默少检查 10 个文件（27 vs 38）。同上，属门禁失效而非风格问题。
exclude = "^(data|models|runs|outputs)/"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchaudio.*", "transformers.*", "librosa.*", "pyarrow.*", "tokenizers.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# coverage
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["beatmorph"]
branch = true
omit = ["*/__init__.py", "tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
